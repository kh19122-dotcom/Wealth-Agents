[project]
name = "wealth_agents"
version = "0.1.0"
description = "Tool-neutral RSS collection and weekly market report generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "feedparser>=6.0.11",
  "PyYAML>=6.0.2",
  "pypdf>=5.0.0",
  "pandas>=2.2.0",
  "yfinance>=0.2.54",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
ibkr = [
  "ib_insync>=0.9.86",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wealth_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "reportlab>=4.0.0",
]
